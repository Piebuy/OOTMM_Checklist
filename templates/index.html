<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #1e1e1e; color: #fff; }
        html { scroll-behavior: smooth; }
        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 30px 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0 0 10px; font-size: 36px; }
        .progress { color: #aaa; font-size: 15px; margin-bottom: 15px; }
        .toggle-container { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .toggle-button { padding: 10px 18px; border: none; border-radius: 6px; background: #444; color: #fff; font-size: 15px; cursor: pointer; }
        .toggle-button:hover { background: #555; }
        .search-container { display: flex; justify-content: center; margin-bottom: 20px; }
        .search-input { width: 100%; max-width: 600px; padding: 11px 14px; border: 1px solid #555; border-radius: 7px; background: #292929; color: #fff; font-size: 15px; outline: none; }
        .search-input:focus { border-color: #777; }
        .search-input::placeholder { color: #888; }
        .locations { display: flex; flex-direction: column; gap: 8px; }
        .location-row { display: flex; align-items: stretch; gap: 8px; width: 100%; }
        .location { flex: 0 0 calc(100% - 56px); min-width: 0; display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: #2b2b2b; border-radius: 8px; transition: background .15s, opacity .15s; }
        .location:hover { background: #353535; }
        .scene-header { margin-top: 25px; margin-bottom: 8px; padding: 8px 4px; font-size: 20px; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid #444; }
        .scene-header:first-child { margin-top: 0; }
        .location input[type="checkbox"] { width: 22px; height: 22px; flex-shrink: 0; cursor: pointer; }
        .junk-container { display: flex; align-items: center; gap: 5px; color: #777; font-size: 12px; flex-shrink: 0; }
        .location input.junk-checkbox { width: 18px; height: 18px; cursor: pointer; opacity: .65; }
        .junk-container label { cursor: pointer; user-select: none; }
        .location-content { flex: 1; min-width: 0; }
        .location-name { display: block; font-size: 18px; cursor: pointer; }
        .item { color: #aaa; font-size: 14px; margin-left: 8px; }
        .location.checked { opacity: .5; }
        .location.checked .location-name { text-decoration: line-through; }

        /* Notes are a separate column outside the check card. */
        .note-container { flex: 0 0 48px; min-width: 48px; display: flex; align-items: stretch; justify-content: center; background: #3a3a3a; border-radius: 8px; padding: 8px; transition: flex-basis .15s, min-width .15s; }
        .note-container.expanded { flex-basis: 300px; min-width: 300px; }
        .note-display { width: 100%; display: flex; align-items: center; gap: 7px; }
        .note-preview { color: #ddd; font-size: 13px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; flex: 1; min-width: 0; }
        .note-preview.no-note { color: #999; font-style: italic; }
        .note-icon-button, .note-edit-button { border: none; border-radius: 5px; cursor: pointer; flex-shrink: 0; }
        .note-icon-button { width: 32px; height: 32px; padding: 0; background: #4a4a4a; color: #ccc; font-size: 17px; }
        .note-icon-button:hover, .note-edit-button:hover { background: #555; color: #fff; }
        .note-icon-button.has-note { color: #fff; }
        .note-edit-button { width: 25px; height: 25px; padding: 0; background: #444; color: #bbb; font-size: 13px; }
        .note-editor { display: flex; flex-direction: column; gap: 6px; width: 100%; }
        .note-editor textarea { width: 100%; min-height: 60px; resize: vertical; padding: 7px; border: 1px solid #555; border-radius: 5px; background: #292929; color: #fff; font-family: inherit; font-size: 13px; }
        .note-editor-buttons { display: flex; gap: 5px; justify-content: flex-end; }
        .note-save-button, .note-cancel-button { border: none; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
        .note-save-button { background: #555; color: #fff; }
        .note-cancel-button { background: #333; color: #999; }

        .floating-controls { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; gap: 8px; align-items: center; }
        .floating-button { height: 46px; padding: 0 14px; border: none; border-radius: 23px; background: #444; color: #fff; font-size: 13px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.35); opacity: .85; white-space: nowrap; }
        .floating-button:hover { background: #555; opacity: 1; }
        .floating-button.back-to-top { width: 46px; padding: 0; font-size: 22px; }
        .status { text-align: center; margin-top: 20px; color: #888; font-size: 13px; }
        .loading { text-align: center; padding: 30px; color: #999; }
        @media (max-width: 700px) {
            .floating-controls { top: 10px; right: 10px; gap: 5px; }
            .floating-button { height: 40px; padding: 0 9px; font-size: 11px; }
            .floating-button.back-to-top { width: 40px; font-size: 19px; }
            .note-container.expanded { flex-basis: 220px; min-width: 220px; }
        }
        @media (max-width: 500px) {
            .location-row { gap: 5px; }
            .location { flex-basis: calc(100% - 47px); padding: 12px 10px; gap: 9px; }
            .location-name { font-size: 15px; }
            .junk-container label { display: none; }
            .note-container { flex-basis: 42px; min-width: 42px; padding: 5px; }
            .note-container.expanded { flex-basis: 180px; min-width: 180px; }
            .search-input { font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 id="current-location">Loading...</h1>
        <div id="progress" class="progress">0 / 0 checked</div>
        <div class="toggle-container">
            <button id="toggle-button" class="toggle-button" onclick="toggleChecked()">Hide Checked</button>
            <button id="view-toggle-button" class="toggle-button" onclick="toggleView()">Show All</button>
            <button id="notes-toggle-button" class="toggle-button" onclick="toggleNotes()">Show Notes</button>
            <button class="toggle-button" onclick="resetLocations()">Reset</button>
        </div>
        <div class="search-container">
            <input id="search-input" class="search-input" type="search" placeholder="Search scene, check name, item, or notes..." autocomplete="off" aria-label="Search checks">
        </div>
    </div>
    <div id="locations" class="locations"><div class="loading">Loading...</div></div>
    <div id="status" class="status">Connecting...</div>
</div>

<div class="floating-controls">
    <button id="floating-checked-button" class="floating-button" type="button" onclick="toggleChecked()">Hide Checked</button>
    <button id="floating-view-button" class="floating-button" type="button" onclick="toggleView()">Show All</button>
    <button id="floating-notes-button" class="floating-button" type="button" onclick="toggleNotes()">Show Notes</button>
    <button class="floating-button back-to-top" type="button" aria-label="Back to top" title="Back to top" onclick="scrollToTop()">↑</button>
</div>

<script>
    let viewMode = "current";
    let displayedKey = null;
    let hideChecked = false;
    let showNotes = false;
    let searchTerm = "";
    const individuallyOpenNotes = new Set();

    function isCompleted(check) { return check.checked === true || check.junk === true; }
    function noteKey(scene, location) { return String(scene) + "::" + String(location); }
    function scrollToTop() { window.scrollTo({ top: 0, behavior: "smooth" }); }
    function normalizeSearch(value) { return String(value || "").toLocaleLowerCase(); }

    function checkMatchesSearch(check, scene) {
        if (hideChecked && isCompleted(check)) return false;

        const term = normalizeSearch(searchTerm).trim();
        if (!term) return true;

        const values = [
            scene,
            check.location,
            isCompleted(check) ? check.item : "",
            check.notes
        ];
        return values.some(value => normalizeSearch(value).includes(term));
    }

    function updateFloatingButtons() {
        const checkedText = hideChecked ? "Show Checked" : "Hide Checked";
        const viewText = viewMode === "current" ? "Show All" : "Current Location";
        const notesText = showNotes ? "Hide Notes" : "Show Notes";
        document.getElementById("floating-checked-button").textContent = checkedText;
        document.getElementById("floating-view-button").textContent = viewText;
        document.getElementById("floating-notes-button").textContent = notesText;
        document.getElementById("toggle-button").textContent = checkedText;
        document.getElementById("view-toggle-button").textContent = viewText;
        document.getElementById("notes-toggle-button").textContent = notesText;
    }

    async function loadCurrentData(forceRender = false) {
        try {
            const response = await fetch("/api/current");
            if (!response.ok) throw new Error("Server error");
            const data = await response.json();
            if (viewMode !== "current") return;
            if (forceRender || displayedKey !== data.current_key) {
                displayedKey = data.current_key;
                renderCurrentLocations(data);
            } else updateCurrentProgress(data);
            document.getElementById("status").textContent = "Connected";
        } catch (error) { console.error(error); document.getElementById("status").textContent = "Connection error"; }
    }

    async function resetLocations() {
        try {
            const response = await fetch("/api/reset", { method: "POST" });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error(result.error || "Reset failed");
            if (viewMode === "all") await showAllLocations();
            else { displayedKey = null; await loadCurrentData(); }
            document.getElementById("status").textContent = "Reset";
        } catch (error) { console.error(error); document.getElementById("status").textContent = "Reset failed"; }
    }

    async function toggleView() { if (viewMode === "current") await showAllLocations(); else await showCurrentLocation(); }

    async function toggleNotes() {
        showNotes = !showNotes;
        updateFloatingButtons();
        if (viewMode === "current") await loadCurrentData(true);
        else await showAllLocations();
    }

    function renderCurrentLocations(data) {
        document.getElementById("current-location").textContent = data.current_key || "No location";
        renderLocations(data.locations, data.current_key);
        updateCurrentProgress(data);
    }

    function renderLocations(locations, scene) {
        const container = document.getElementById("locations");
        container.innerHTML = "";
        if (!locations || locations.length === 0) { container.innerHTML = '<div class="loading">No locations found.</div>'; return; }

        const matchingLocations = locations.filter(check => checkMatchesSearch(check, scene === null ? check.scene : scene));
        if (matchingLocations.length === 0) {
            container.innerHTML = '<div class="loading">No checks match your search.</div>';
            return;
        }

        if (scene !== null) {
            matchingLocations.forEach(check => createLocationRow(container, check, scene));
            return;
        }

        let currentScene = null;
        matchingLocations.forEach(check => {
            if (check.scene !== currentScene) {
                currentScene = check.scene;
                const sceneHeader = document.createElement("div");
                sceneHeader.className = "scene-header";
                sceneHeader.textContent = currentScene;
                container.appendChild(sceneHeader);
            }
            createLocationRow(container, check, check.scene);
        });
    }

    function createLocationRow(container, check, scene) {
        const row = document.createElement("div");
        row.className = "location-row";
        const completed = isCompleted(check);

        const locationCard = document.createElement("div");
        locationCard.className = "location";
        if (completed) locationCard.classList.add("checked");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = check.checked === true;
        checkbox.addEventListener("change", () => updateCheckState(scene, check.location, "checked", checkbox.checked));

        const content = document.createElement("div");
        content.className = "location-content";
        const name = document.createElement("span");
        name.className = "location-name";
        name.textContent = check.location;
        name.addEventListener("click", () => { checkbox.checked = !checkbox.checked; checkbox.dispatchEvent(new Event("change")); });
        content.appendChild(name);

        if (check.item && completed) {
            const item = document.createElement("span");
            item.className = "item";
            item.textContent = check.item;
            name.appendChild(item);
        }

        locationCard.appendChild(checkbox);
        locationCard.appendChild(content);

        const junkContainer = document.createElement("div");
        junkContainer.className = "junk-container";
        const junkCheckbox = document.createElement("input");
        junkCheckbox.type = "checkbox";
        junkCheckbox.className = "junk-checkbox";
        junkCheckbox.checked = check.junk === true;
        junkCheckbox.id = "junk-" + Math.random().toString(36).slice(2);
        const junkLabel = document.createElement("label");
        junkLabel.htmlFor = junkCheckbox.id;
        junkLabel.textContent = "Junk";
        junkCheckbox.addEventListener("change", () => updateCheckState(scene, check.location, "junk", junkCheckbox.checked));
        junkContainer.appendChild(junkCheckbox);
        junkContainer.appendChild(junkLabel);
        locationCard.appendChild(junkContainer);

        row.appendChild(locationCard);
        const noteContainer = createNoteEditor(check, scene);
        row.appendChild(noteContainer);
        container.appendChild(row);

        if (normalizeSearch(searchTerm).trim() && check.notes && normalizeSearch(check.notes).includes(normalizeSearch(searchTerm).trim()) && !showNotes) {
            individuallyOpenNotes.add(noteKey(scene, check.location));
            renderNoteDisplay(noteContainer, check, scene);
        }
    }

    function createNoteEditor(check, scene) {
        const container = document.createElement("div");
        container.className = "note-container";
        renderNoteDisplay(container, check, scene);
        return container;
    }

    function renderNoteDisplay(container, check, scene) {
        container.innerHTML = "";
        const note = typeof check.notes === "string" ? check.notes : "";
        const key = noteKey(scene, check.location);
        const individualOpen = individuallyOpenNotes.has(key);
        const expanded = showNotes || individualOpen;

        if (expanded) container.classList.add("expanded");
        else container.classList.remove("expanded");

        const display = document.createElement("div");
        display.className = "note-display";

        if (expanded) {
            const preview = document.createElement("span");
            preview.className = "note-preview" + (note ? "" : " no-note");
            preview.textContent = note || "No note";
            preview.title = note;
            display.appendChild(preview);

            const editButton = document.createElement("button");
            editButton.className = "note-edit-button";
            editButton.type = "button";
            editButton.textContent = "✎";
            editButton.title = "Edit note";
            editButton.setAttribute("aria-label", "Edit note");
            editButton.addEventListener("click", () => openNoteEditor(container, check, scene));
            display.appendChild(editButton);
        }

        const noteButton = document.createElement("button");
        noteButton.className = "note-icon-button" + (note ? " has-note" : "");
        noteButton.type = "button";
        noteButton.textContent = expanded ? "←→" : "→";
        noteButton.title = expanded ? "Hide note" : "Show note";
        noteButton.setAttribute("aria-label", noteButton.title);
        noteButton.addEventListener("click", () => {
            if (showNotes) {
                showNotes = false;
                updateFloatingButtons();
            }
            if (individuallyOpenNotes.has(key)) individuallyOpenNotes.delete(key);
            else individuallyOpenNotes.add(key);
            renderNoteDisplay(container, check, scene);
        });
        display.appendChild(noteButton);
        container.appendChild(display);
    }

    function openNoteEditor(container, check, scene) {
        container.classList.add("expanded");
        container.innerHTML = "";
        const editor = document.createElement("div");
        editor.className = "note-editor";
        const textarea = document.createElement("textarea");
        textarea.value = typeof check.notes === "string" ? check.notes : "";
        textarea.placeholder = "Add a note...";
        textarea.maxLength = 2000;

        const buttons = document.createElement("div");
        buttons.className = "note-editor-buttons";
        const cancel = document.createElement("button");
        cancel.className = "note-cancel-button";
        cancel.type = "button";
        cancel.textContent = "Cancel";
        cancel.onclick = () => renderNoteDisplay(container, check, scene);

        const save = document.createElement("button");
        save.className = "note-save-button";
        save.type = "button";
        save.textContent = "Save";
        save.onclick = async () => {
            save.disabled = true;
            await saveNote(scene, check, textarea.value);
            save.disabled = false;
        };

        buttons.appendChild(cancel);
        buttons.appendChild(save);
        editor.appendChild(textarea);
        editor.appendChild(buttons);
        container.appendChild(editor);
        textarea.focus();
    }

    async function saveNote(scene, check, note) {
        try {
            const response = await fetch("/api/note", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ scene: scene, location: check.location, note: note })
            });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error(result.error || "Failed to save note");
            check.notes = note;
            individuallyOpenNotes.add(noteKey(scene, check.location));
            document.getElementById("status").textContent = "Note saved";
            if (viewMode === "all") await showAllLocations();
            else { displayedKey = null; await loadCurrentData(true); }
        } catch (error) { console.error(error); document.getElementById("status").textContent = "Failed to save note"; }
    }

    function updateCurrentProgress(data) {
        const checked = data.checked_locations || 0;
        const total = data.total_locations || 0;
        const allChecked = data.all_checked || 0;
        const allTotal = data.all_total || 0;
        const currentPercent = total > 0 ? (checked / total) * 100 : 0;
        const totalPercent = allTotal > 0 ? (allChecked / allTotal) * 100 : 0;
        document.getElementById("progress").textContent = `${checked} / ${total} checked — ${currentPercent.toFixed(1)}% (${totalPercent.toFixed(1)}%)`;
    }

    async function toggleChecked() {
        hideChecked = !hideChecked;
        updateFloatingButtons();
        if (viewMode === "current") { const response = await fetch("/api/current"); const data = await response.json(); renderCurrentLocations(data); }
        else await showAllLocations();
    }

    async function showAllLocations() {
        viewMode = "all";
        updateFloatingButtons();
        try {
            const response = await fetch("/api/all");
            if (!response.ok) throw new Error("Server error");
            const data = await response.json();
            document.getElementById("current-location").textContent = "All Locations";
            renderLocations(data.locations, null);
            updateAllProgress(data.locations);
            document.getElementById("status").textContent = "Showing all locations";
        } catch (error) { console.error(error); document.getElementById("status").textContent = "Failed to load locations"; }
    }

    function updateAllProgress(locations) {
        const total = locations.length;
        const checked = locations.filter(location => isCompleted(location)).length;
        const percentage = total > 0 ? (checked / total) * 100 : 0;
        document.getElementById("progress").textContent = `${checked} / ${total} checked — ${percentage.toFixed(1)}%`;
    }

    async function showCurrentLocation() { viewMode = "current"; displayedKey = null; updateFloatingButtons(); await loadCurrentData(); }

    async function updateCheckState(scene, location, type, value) {
        try {
            const response = await fetch("/api/check", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ scene: scene, location: location, type: type, value: value })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "Failed to save");
            if (viewMode === "all") await showAllLocations();
            else { displayedKey = null; await loadCurrentData(); }
            document.getElementById("status").textContent = "Saved";
        } catch (error) { console.error(error); document.getElementById("status").textContent = "Failed to save"; }
    }

    document.getElementById("search-input").addEventListener("input", event => {
        searchTerm = event.target.value;
        if (viewMode === "current") loadCurrentData(true);
        else showAllLocations();
    });

    setInterval(loadCurrentData, 1000);
    updateFloatingButtons();
    loadCurrentData();
</script>
</body>
</html>
